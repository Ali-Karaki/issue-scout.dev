name: Refresh cache
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call refresh-batch endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          SITE_URL=$(jq -r '.url' config/site.json)
          response=$(curl -sS -w "
HTTP_STATUS:%{http_code}" -X POST             -H "Authorization: Bearer $CRON_SECRET"             "$SITE_URL/api/cron/refresh-batch")
          echo "$response"
          status=$(echo "$response" | tail -1 | cut -d: -f2)
          if [ "$status" = "200" ] || [ "$status" = "207" ]; then
            echo "Refresh accepted (HTTP $status)"
            exit 0
          fi
          echo "Refresh failed (HTTP $status)"
          exit 1
